services:
  - type: web
    name: aichatbot-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: METRICS_AUTH_TOKEN
        sync: false # Set securely in Render dashboard
      - key: ADK_OFFLINE_MODE
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: DO_NOT_TRACK
        value: "1"
      - key: EVIDENTLY_DISABLE_TELEMETRY
        value: "1"
      - key: MLFLOW_ALLOW_FILE_STORE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false # Set to the exact Static Site origin after creation
      - key: FEEDBACK_STORAGE_PATH
        value: /var/data/feedback/user_feedback.jsonl
      - key: MODEL_ARTIFACTS_DIR
        value: /var/data/models
      - key: DAGSHUB_USERNAME
        sync: false
      - key: DAGSHUB_TOKEN
        sync: false
    disk:
      name: chatbot-state
      mountPath: /var/data
      sizeGB: 1

