name: Deploy ChatBot Service

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target (render / cloud-run / fly)'
        required: true
        default: 'render'
        type: choice
        options:
          - render
          - cloud-run
          - fly

concurrency:
  group: deployment-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to Render (Webhook Trigger)
        if: github.event.inputs.target == 'render'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL secret is not configured in repository secrets."
            echo "Configure RENDER_DEPLOY_HOOK_URL in GitHub Repo > Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Triggering Render deployment..."
          curl -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deployment triggered successfully on Render."

      - name: Deploy to Fly.io
        if: github.event.inputs.target == 'fly'
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "ERROR: FLY_API_TOKEN secret is not configured."
            exit 1
          fi
          flyctl deploy --remote-only

