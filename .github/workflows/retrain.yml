name: Continuous Learning & Model Retraining

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      min_feedback:
        description: 'Minimum new verified feedback records required to retrain'
        required: true
        default: '10'
        type: string
      force_promote:
        description: 'Run despite the feedback-count threshold (quality gates still apply)'
        required: false
        default: false
        type: boolean

concurrency:
  group: continuous-retraining-pipeline
  cancel-in-progress: false

jobs:
  retrain-and-evaluate:
    name: Train and Evaluate Candidate (No Serving Promotion)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Configure DVC remote and materialize tracked inputs
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          test -n "$DAGSHUB_USERNAME"
          test -n "$DAGSHUB_TOKEN"
          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user "$DAGSHUB_USERNAME"
          dvc remote modify --local dagshub password "$DAGSHUB_TOKEN"
          dvc pull ChatBot-PipeLine/data/raw/Intent.json.dvc artifacts/models/v0.1.0-baseline

      - name: Run Retraining Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          METRICS_AUTH_TOKEN: ${{ secrets.METRICS_AUTH_TOKEN }}
          ADK_OFFLINE_MODE: "true"
          DO_NOT_TRACK: "1"
          EVIDENTLY_DISABLE_TELEMETRY: "1"
          MLFLOW_ALLOW_FILE_STORE: "true"
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          DVC_PUSH_ON_RETRAIN: "true"
        run: |
          FORCE_ARG=""
          if [ "${{ inputs.force_promote }}" = "true" ]; then
            FORCE_ARG="--force-promote"
          fi
          MIN_FB="${{ inputs.min_feedback }}"
          if [ -z "$MIN_FB" ]; then
            MIN_FB="10"
          fi

          echo "Executing continuous retraining pipeline (min_feedback=$MIN_FB, force_promote=${{ inputs.force_promote }})..."
          python ChatBot-PipeLine/src/pipeline/retraining_pipeline.py \
            --dry-run \
            --min-feedback "$MIN_FB" \
            $FORCE_ARG

      - name: Archive Evidently Reports & Evaluation Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retraining-artifacts-${{ github.run_id }}
          path: |
            artifacts/reports/evidently/
            artifacts/metrics/
            artifacts/models/candidate-*/
          retention-days: 14

